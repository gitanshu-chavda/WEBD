<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>lists</title>
    </head>
    <body>
        An Ordered List:
        <ol>
            <li>first item</li>
            <li>second item</li>
            <li>third item</li>
        </ol> 
        An Unordered List:
        <ul>
            <li>fourth item</li>
            <li>fifth item</li>
            <li>sixth item</li>
        </ul>
    </body>
</html>
